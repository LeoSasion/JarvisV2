name: JarvisV2 CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvisv2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-and-publication-boundary:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up .NET
        # actions/setup-dotnet v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Validate public source boundary
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-PublicationBoundary.ps1

      - name: Validate platform layout
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-PlatformLayout.ps1

      - name: Parse PowerShell and JSON
        shell: pwsh
        run: |
          $parseFailures = [System.Collections.Generic.List[string]]::new()
          foreach ($script in Get-ChildItem -LiteralPath .\scripts -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors)
            foreach ($error in @($errors)) {
              $parseFailures.Add("$($script.Name): $($error.Message)")
            }
          }
          foreach ($json in Get-ChildItem -LiteralPath .\config -Filter *.json) {
            try {
              $null = Get-Content -LiteralPath $json.FullName -Raw |
                ConvertFrom-Json -Depth 100
            }
            catch {
              $parseFailures.Add("$($json.Name): invalid JSON")
            }
          }
          if ($parseFailures.Count -ne 0) {
            throw ($parseFailures -join [Environment]::NewLine)
          }

      - name: Audit Pi Agent desktop host boundary
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-PiAgentHost.ps1
          -StaticOnly

      - name: Build safety supervisor
        shell: pwsh
        run: >-
          dotnet build
          .\src\platforms\windows11\Jarvis.Supervisor\Jarvis.Supervisor.csproj
          --configuration Release
          --nologo
          --warnaserror

      - name: Audit and build review-gated control center
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ControlCenter.ps1

      - name: Audit and build own-process native style lab
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-NativeStyleLab.ps1

      - name: Audit and build Windows 10 own-process native style probe
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-Windows10NativeStyleProbe.ps1
          -StaticOnly

      - name: Audit and build Windows 10 read-only Shell surface probe
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-Windows10ShellSurfaceProbe.ps1
          -StaticOnly

      - name: Audit and build Windows 10 bounded desktop style session
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-Windows10DesktopStyleSession.ps1
          -StaticOnly

      - name: Audit and build Windows 10 Explorer caption plan
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-Windows10ExplorerCaptionPlan.ps1
          -StaticOnly

      - name: Audit and build Windows 10 Explorer caption session
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-Windows10ExplorerCaptionSession.ps1

      - name: Audit and build Windows 10 owned Explorer caption overlay
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-Windows10ExplorerCaptionOverlay.ps1

      - name: Audit and build Windows 10 owned taskbar edge overlay
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-Windows10TaskbarEdgeOverlay.ps1

      - name: Upload Windows 10 taskbar edge visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win10-taskbar-edge-overlay
          path: artifacts/win10-taskbar-edge-overlay-tests/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Audit Windows 10 offline Shell surface selector model
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-Windows10SurfaceSelectorModel.ps1

      - name: Audit Windows 10 Neural Void RGB theme model
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-Windows10RgbThemeModel.ps1

      - name: Audit Windows 10 Neural Void own-process preview
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-Windows10NeuralVoidPreview.ps1

      - name: Upload Windows 10 Neural Void visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win10-neural-void-preview
          path: artifacts/win10-neural-void-preview-tests/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Audit desktop host probe without live inspection
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-DesktopStyleProbe.ps1
          -StaticOnly

      - name: Audit desktop text-color session without live inspection
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-DesktopStyleSession.ps1
          -StaticOnly

      - name: Audit native Explorer window style without live inspection
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-NativeWindowStyleSession.ps1
          -StaticOnly

      - name: Audit offline Explorer host model
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerHostModel.ps1

      - name: Audit offline Explorer bridge contract
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerBridgeModel.ps1
          -StaticOnly

      - name: Audit offline Explorer frame transaction model
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerFrameModel.ps1

      - name: Audit offline Explorer selector and preview model
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerPreviewModel.ps1

      - name: Audit exact read-only Explorer surface probe without running it
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerSurfaceProbe.ps1

      - name: Audit offline exact-target Explorer XAML transport core
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerTransportModel.ps1
          -StaticOnly

      - name: Audit disk-only Explorer read-only TAP boundary
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerReadOnlyTap.ps1
          -StaticOnly

      - name: Audit offline Explorer admission and fingerprint models
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerReadOnlyAdmission.ps1
          -StaticOnly

      - name: Audit offline Explorer IInspectable projection adapter
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerInspectableAdapter.ps1
          -StaticOnly

      - name: Audit offline reversible Explorer style transaction
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerStyleTransaction.ps1
          -StaticOnly

      - name: Audit unlinked Explorer XAML read bridge
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerXamlReadBridge.ps1
          -StaticOnly

      - name: Audit bounded Explorer XAML surface discovery
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerXamlSurfaceDiscovery.ps1
          -StaticOnly

      - name: Audit controlled-live controller
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-M2ControlledLiveController.ps1

      - name: State native-build boundary
        shell: pwsh
        run: |
          Write-Output "Canonical native compilation is intentionally not run."
          Write-Output "It requires the separately provisioned hash-locked portable toolchain."
          Write-Output "This CI run never authorizes activation or live Explorer use."
