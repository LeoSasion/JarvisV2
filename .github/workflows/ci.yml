name: JarvisV2 CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvisv2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-and-publication-boundary:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up .NET
        # actions/setup-dotnet v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Validate public source boundary
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-PublicationBoundary.ps1

      - name: Parse PowerShell and JSON
        shell: pwsh
        run: |
          $parseFailures = [System.Collections.Generic.List[string]]::new()
          foreach ($script in Get-ChildItem -LiteralPath .\scripts -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors)
            foreach ($error in @($errors)) {
              $parseFailures.Add("$($script.Name): $($error.Message)")
            }
          }
          foreach ($json in Get-ChildItem -LiteralPath .\config -Filter *.json) {
            try {
              $null = Get-Content -LiteralPath $json.FullName -Raw |
                ConvertFrom-Json -Depth 100
            }
            catch {
              $parseFailures.Add("$($json.Name): invalid JSON")
            }
          }
          if ($parseFailures.Count -ne 0) {
            throw ($parseFailures -join [Environment]::NewLine)
          }

      - name: Build safety supervisor
        shell: pwsh
        run: >-
          dotnet build
          .\src\Jarvis.Supervisor\Jarvis.Supervisor.csproj
          --configuration Release
          --nologo
          --warnaserror

      - name: Audit and build read-only control center
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ControlCenter.ps1

      - name: Audit and build own-process native style lab
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-NativeStyleLab.ps1

      - name: Audit desktop host probe without live inspection
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-DesktopStyleProbe.ps1
          -StaticOnly

      - name: Audit desktop text-color session without live inspection
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-DesktopStyleSession.ps1
          -StaticOnly

      - name: Audit offline Explorer host model
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerHostModel.ps1

      - name: Audit offline Explorer bridge contract
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-ExplorerBridgeModel.ps1
          -StaticOnly

      - name: Audit controlled-live controller
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File
          .\scripts\Test-M2ControlledLiveController.ps1

      - name: State native-build boundary
        shell: pwsh
        run: |
          Write-Output "Canonical native compilation is intentionally not run."
          Write-Output "It requires the separately provisioned hash-locked portable toolchain."
          Write-Output "This CI run never authorizes activation or live Explorer use."
